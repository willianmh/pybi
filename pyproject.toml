[project]
name = "pybi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Willian Hayashida", email = "will.hayashida07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.5",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-codspeed>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
